name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make app project
        run: |
          mkdir -p /tmp/app/www
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/app/www/
          mv /tmp/app/www/Index.html /tmp/app/www/index.html || true
          cd /tmp/app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npx cap init "Daily Expense Manager" com.myhtml.expense --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd /tmp/app/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" /tmp/app/android/app/build/outputs/apk/debug/app-debug.apk --repo "$GITHUB_REPOSITORY" --title "APK ${{ github.run_number }}" --notes "app-debug.apk download karo aur install karo"
